name: Build PullOver X (rootless)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          XCODE_PATH=$(find /Applications -maxdepth 1 -name 'Xcode*.app' -print | sort | tail -1)
          test -n "$XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos

      - name: Install build tools
        run: |
          brew install ldid dpkg
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"

      - name: Install Theos and iOS SDK
        run: |
          sudo git clone --recursive https://github.com/theos/theos.git /opt/theos
          sudo chown -R "$USER":staff /opt/theos
          curl -fsSL https://github.com/theos/sdks/archive/master.tar.gz | tar -xz -C /tmp
          cp -R /tmp/sdks-master/*.sdk /opt/theos/sdks/
          test -d /opt/theos/sdks
          find /opt/theos -name 'libsubstrate.tbd' -print
          echo "THEOS=/opt/theos" >> "$GITHUB_ENV"

      - name: Build rootless package
        run: |
          chmod +x build.sh
          ./build.sh rootless release

      - name: Verify package layout
        run: |
          test -n "$(find packages -name '*.deb' -print -quit)"
          dpkg-deb -I packages/*.deb
          dpkg-deb -c packages/*.deb | grep -E '/var/jb/(Library/MobileSubstrate|Library/PreferenceBundles|Library/PreferenceLoader)'

      - name: Upload rootless .deb
        uses: actions/upload-artifact@v4
        with:
          name: pulloverx-rootless-deb
          path: packages/*.deb
          if-no-files-found: error
